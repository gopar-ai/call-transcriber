<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #1c1f26;
        --text: #f4f5f7;
        --muted: #9aa0ab;
        --accent: #00f5c4;
      }
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        width: 260px;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
      }
      .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
      .brand img { width: 26px; height: 26px; border-radius: 7px; }
      h1 { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; margin: 0; }
      .sig { font-size: 10px; color: #00f5c4; opacity: 0.75; text-align: right; margin-top: 10px; letter-spacing: 0.04em; }
      label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        margin-bottom: 12px;
        cursor: pointer;
      }
      input[type="checkbox"] { accent-color: var(--accent); }
      button {
        all: unset;
        cursor: pointer;
        width: 100%;
        text-align: center;
        padding: 12px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        background: var(--accent);
        color: #0b0d12;
      }
      button:hover { opacity: 0.9; }
      .hint { font-size: 11px; color: var(--muted); margin-top: 12px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div class="brand"><img src="icons/icon48.png" alt="" /><h1>CALL TRANSCRIBER</h1></div>
    <label><input type="checkbox" id="recordVideo" /> Guardar grabación (video) en Drive</label>
    <button id="start">Iniciar grabación</button>
    <div class="hint">
      Normalmente no necesitas esto — en Meet aparece un botón flotante solo.
      Úsalo para arrancar manual en otra plataforma o pestaña.
    </div>
    <div class="sig">⚡ by Jan</div>
    <script src="popup.js"></script>
  </body>
</html>
